version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workday-helper-backend
    ports:
      - "8080:8080"
    volumes:
      # Persist H2 database files on the host
      - h2-data:/app/data
    env_file:
      - .env
    environment:
      # Override H2 URL to use the container volume path (already defaults to ./data/workdaydb)
      # These are fallbacks in case .env is missing some values
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://workday.tawonarwatida.co.zw/api/calendar/callback}
    restart: unless-stopped

volumes:
  h2-data:
